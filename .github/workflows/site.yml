name: Site

# Started every 10 minutes by cron-job.org (GitHub's own scheduler skips too many runs).
# Each run updates the site when it's due (about hourly) or follows PSL games live;
# most finish in seconds.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LIVE_DEPLOY: "1"
      REQUEST_GAP: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update or follow live games
        run: python runner.py
