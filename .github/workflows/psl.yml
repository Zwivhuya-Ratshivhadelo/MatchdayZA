name: PSL scores (hourly)

on:
  schedule:
    - cron: "23 * * * *"        # every hour at :23 (UTC)
  workflow_dispatch:
    inputs:
      debug:
        description: "Save raw pages for fixing the scraper"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: psl-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAVE_HTML: ${{ inputs.debug && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scrape psl.co.za
        id: scrape
        continue-on-error: true
        run: python psl.py

      - name: Save data (the site updates from it)
        run: bash commit.sh

      - name: Upload raw pages (debug runs)
        if: inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: psl-raw-pages
          path: data/_debug/

      - name: Flag scraper problems
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::The PSL scraper reported problems. Check the 'Scrape psl.co.za' step log."
          exit 1
