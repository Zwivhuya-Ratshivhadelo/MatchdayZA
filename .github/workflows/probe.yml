name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests beautifulsoup4
      - run: python _probe.py > probe-out.txt 2>&1 || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-out; git add -f probe-out.txt; git commit -qm probe; git push -f origin probe-out
