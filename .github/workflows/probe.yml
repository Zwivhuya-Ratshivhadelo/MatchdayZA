name: Probe live feeds

# One-off check of outside live-score feeds; runs when probe.py changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [probe.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python probe.py
      - run: bash commit.sh
