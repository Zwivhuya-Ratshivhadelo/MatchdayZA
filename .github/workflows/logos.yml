name: Club logos

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Download all logos again (replace existing ones)"
        type: boolean
        default: false
  schedule:
    - cron: "11 3 1 * *"   # 1st of every month, picks up newly promoted clubs

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download club logos
        run: python logos.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: Save logos
        run: bash commit.sh
