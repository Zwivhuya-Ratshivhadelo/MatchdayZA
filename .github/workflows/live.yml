name: Match-day live scores

on:
  schedule:
    - cron: "57 10 * * *"   # 12:57 SAST: games kicking off before 15:30
    - cron: "13 12 * * *"   # 14:13 SAST: 15:30 to 17:29
    - cron: "13 14 * * *"   # 16:13 SAST: 17:30 to 19:29
    - cron: "13 16 * * *"   # 18:13 SAST: 19:30 or later
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LIVE_DEPLOY: "1"
      REQUEST_GAP: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Follow today's games
        run: |
          case "${{ github.event.schedule }}" in
            "57 10 * * *") W=a ;;
            "13 12 * * *") W=b ;;
            "13 14 * * *") W=c ;;
            "13 16 * * *") W=d ;;
            *) W="" ;;
          esac
          python live.py $W
