name: ABC Motsepe League

on:
  schedule:
    - cron: "41 4,10,16,20 * * *"   # 06:41, 12:41, 18:41, 22:41 SAST
  workflow_dispatch:
    inputs:
      debug:
        description: "Save raw pages for fixing the scraper"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: abc-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAVE_HTML: ${{ inputs.debug && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scrape ABC Motsepe League
        id: scrape
        continue-on-error: true
        run: python abc_league.py

      - name: Save data (the site updates from it)
        run: bash commit.sh

      - name: Upload raw pages (debug runs)
        if: inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: abc-raw-pages
          path: data/_debug/

      - name: Flag scraper problems
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::The ABC Motsepe scraper reported problems. Check the 'Scrape ABC Motsepe League' step log."
          exit 1
