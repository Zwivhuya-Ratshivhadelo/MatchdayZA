name: Keep running

# Hourly updates and live games, chained run after run (GitHub's own schedule was not firing).
# Starts when keeper.py or this file changes (or with "Run workflow"); each run starts the next one.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [keeper.py, .github/workflows/keep.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: keep
  cancel-in-progress: true

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_DEPLOY: "1"
      REQUEST_GAP: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update every hour and follow live games
        run: python keeper.py
