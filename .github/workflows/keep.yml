name: Keep running

# Backup for GitHub's scheduler: does what's due every 5 minutes and starts the next run itself.
# Shares the "site" queue with the Site workflow, so they never run at the same time.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [keeper.py, runner.py, .github/workflows/keep.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_DEPLOY: "1"
      REQUEST_GAP: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update when due and follow live games
        run: python keeper.py
